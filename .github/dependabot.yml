version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-development:
        patterns:
          - "build"
          - "hatchling"
          - "mypy"
          - "pytest*"
          - "ruff"
          - "types-*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
