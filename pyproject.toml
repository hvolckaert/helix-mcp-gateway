[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "helix-mcp-gateway"
version = "0.6.6"
description = "Policy-controlled MCP access to BMC Helix through the AR API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hugo Volckaert" },
]
dependencies = [
    "cryptography>=46,<51",
    "httpx>=0.28.1,<1",
    "mcp>=1.28.1,<2",
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.3,<7",
    "python-dotenv>=1.2.2,<2",
    "sqlglot>=30.14,<40",
]

[project.urls]
Repository = "https://github.com/hvolckaert/helix-mcp-gateway"
Issues = "https://github.com/hvolckaert/helix-mcp-gateway/issues"
Changelog = "https://github.com/hvolckaert/helix-mcp-gateway/blob/main/CHANGELOG.md"

[project.optional-dependencies]
keyring = [
    "keyring>=25.7,<26",
]
test = [
    "build>=1.4,<2",
    "hatchling>=1.27,<2",
    "mypy>=1.20,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.16,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
helix-mcp = "helix_mcp.server:main"
helix-mcp-check = "helix_mcp.operations.cli:entrypoint"
helix-mcp-setup = "helix_mcp.installation.cli:setup_entrypoint"
helix-mcp-build-bridge = "helix_mcp.installation.cli:bridge_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/helix_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"arapi-bridge/src/main/java/com/example/helix/bridge/ArapiBridge.java" = "helix_mcp/installation/resources/bridge/ArapiBridge.java"
"config/helix.example.yaml" = "helix_mcp/installation/resources/config/helix.example.yaml"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: complete MCP transport scenarios",
    "integration: local integration across real clients and services",
    "java_bridge: real Python-to-Java bridge contract without BMC binaries",
    "local_e2e: reproducible stdio E2E with an isolated Java bridge",
    "live: explicit read-only validation against a controlled Helix target",
]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "hatch_build.py"]
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["keyring"]
ignore_missing_imports = true
